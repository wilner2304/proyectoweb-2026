<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>🎂 DULCE MOMENTO 🎂</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<header class="menu">
    <div class="logo-descripcion">
    <img class="logo-principal" src="img/logo.png">
    <p>DULCE MOMENTO </p>
    </div>
    <ul class="menu-principal">
    <li><a href="#">INICIO</a></li>
    <li><a href="#">PRODUCTOS</a></li>
    <li> <a href="#">SOBRE NOSOTROS  </a></li>
    <li><a href="#">CONTACTO </a></li>
    </ul>
</header>
<main class="contenido-principal">
    <div class="contenedor-imagen-principal">
        <div class="contenedor">
            <h1>Pasteles que hacen sonreír</h1>
            <p>Deliciosos y echos con mucho amor, para cada ocasión</p>
            <div class="botones">
                VER PRODUCTOS
            </div>
        </div>
        <div class="imagen-principal">
        <img src="img/pastel-principal.png" alt="Pastel principal">
        </div>
    </div>
    <section class="seccion-productos">
        <h1>Nuestros productos</h1>
    <div class="contenedor-productos">
        <div class="producto">
            <img src="img/pastel-chocolate.png" alt="Pastel 1">
            <h2>Pastel de chocolate</h2>
            <p>Bs/ 45</p>
            <div class="botones-secundarios">
                comprar
            </div>
        </div>
        <div class="producto">
            <img src="img/pastel-fresa.png" alt="Pastel 1">
            <h2>Pastel de fresa</h2>
            <p>Bs/ 45</p>
            <div class="botones-secundarios">
                comprar
            </div>
        </div>
        <div class="producto">
            <img src="img/pastel-mango.png" alt="Pastel 1">
            <h2>Pastel de mango</h2>
            <p>Bs/ 45</p>
            <div class="botones-secundarios">
                comprar
            </div>
        </div>
    </div>
    </section>
</main>



<script src="js/main.js"></script>
</body>
</html>
